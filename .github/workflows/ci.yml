# ═══════════════════════════════════════════════════════════════════════════
# CI del frontend de ORBI
#
# POR QUÉ VIVE ACÁ Y NO EN EL REPO DEL BACKEND (opción A de `06-capa-0-frontend.md` §3.1):
#
# El repo del backend tiene un job `frontend` que NUNCA CORRE, por tres motivos
# independientes y acumulativos:
#   1. Está guardado por `if: hashFiles('../TracAutoFrontV2/package.json') != ''`
#      y `hashFiles()` resuelve relativo a `GITHUB_WORKSPACE` y no sale de ahí:
#      el `../` devuelve string vacío POR DISEÑO.
#   2. El `if` de un job se evalúa ANTES de `actions/checkout`. Aunque el path
#      fuera válido, en ese momento el disco está vacío.
#   3. `actions/checkout` sin `repository:` clona SOLO el repo actual, y
#      `TracAutoFrontV2` es un repo hermano: nunca aparece en el runner.
#
# Resultado: aparecía como *skipped*, en verde, y nadie lo notaba. Un falso
# verde es peor que no tener job, porque comunica una garantía que no existe.
#
# Regla que sale de ahí y que NO se puede repetir: ningún `if` de este archivo
# depende de un archivo fuera del workspace.
#
# ✅ PENDIENTE SALDADO el 2026-08-18. El job `frontend` de
# `TracAutoV2/.github/workflows/ci.yml` fue borrado, con el porqué escrito en su lugar.
# No se perdió cobertura —nunca corrió— y este workflow pasa a ser el único que
# verifica el front. Ya no hay dos lugares que digan verificarlo y uno que miente.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion:
    name: Tipos · lint · tokens · tests · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: reproducible, y no mueve el lockfile.
      - name: Instalar dependencias
        run: npm ci

      # Separado del build a propósito: falla en segundos y con el error de
      # tipo, no ahogado en un log de bundling.
      - name: Tipos
        run: npm run typecheck

      # Sin `--max-warnings=0` una regla `warn` no rompe nada y el lint es
      # decorativo. El flag está dentro del script.
      #
      # Las violaciones preexistentes del scaffold legacy están CONGELADAS en
      # `eslint-suppressions.json` (baseline, `06-capa-0-frontend.md` §3.3;
      # mismo patrón que `check-links.mjs --baseline=47` del backend). El CI
      # falla si el número CRECE. Para bajarlo: `npm run lint:baseline:podar`.
      # ── La ley del frontend, que este repo NO es dueño de escribir ──────────
      #
      # `docs/reglas/frontend-core.md` es una COPIA GENERADA del original, que vive en
      # `TracAutoV2/docsv2/00-ai-context/reglas/frontend-core.md`. La copia existe porque un
      # `@import` de CLAUDE.md que sale del repo queda detrás de un diálogo de aprobación y, si
      # alguien lo declina una vez, se apaga para siempre y en silencio (DA-FE-31).
      #
      # ⚠️ LO QUE ESTE PASO PUEDE Y NO PUEDE: detecta que alguien EDITÓ LA COPIA A MANO, comparando
      # el `origen-sha256` que declara el banner contra el hash del cuerpo. NO puede detectar que el
      # ORIGINAL cambió: ese archivo está en otro repo y este runner no lo tiene (por el mismo
      # motivo por el que el job `frontend` del backend nunca corría — ver la cabecera). Ese modo de
      # falla lo agarra `orbi-verificar.ps1` en el repo normativo, que es el único lugar donde los
      # dos repos existen a la vez.
      - name: Regla de frontend — la copia no fue editada a mano
        run: |
          node -e '
            const fs = require("node:fs");
            const { createHash } = require("node:crypto");
            const RUTA = "docs/reglas/frontend-core.md";
            const MARCA = "<!-- FIN DEL BANNER GENERADO -->";
            const copia = fs.readFileSync(RUTA, "utf8");
            const i = copia.indexOf(MARCA);
            if (i === -1) {
              console.error(`FALLA  ${RUTA} perdio su banner GENERADO.`);
              console.error("       Regeneralo desde TracAutoV2: node docsv2/scripts/sincronizar-reglas-front.mjs");
              process.exit(1);
            }
            const declarado = (copia.match(/origen-sha256:\s*([0-9a-f]+)/) || [])[1];
            const cuerpo = copia.slice(i + MARCA.length).replace(/^\r?\n/, "");
            const real = createHash("sha256").update(cuerpo.replace(/\r\n/g, "\n"), "utf8").digest("hex").slice(0, 16);
            if (declarado !== real) {
              console.error(`FALLA  ${RUTA} fue editado a mano (banner ${declarado} != cuerpo ${real}).`);
              console.error("       Es una copia generada: edita el ORIGINAL en TracAutoV2 y volve a correr el script.");
              process.exit(1);
            }
            console.log(`OK     ${RUTA} intacta (origen-sha256 ${real}).`);
          '

      - name: Lint (ESLint + reglas ORBI)
        run: npm run lint:eslint

      # Es CSS: ESLint no lo ve. Acá viven F1 sobre `.css`, la dirección de las
      # capas de token, F4 y —sobre todo— F17: el `@theme` sin `inline`, que es
      # el único bug del sistema que invalida el multi-tema entero SIN dejar
      # ningún rastro en consola.
      - name: Capa 0 · tokens y tema
        run: npm run lint:tokens

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

      # Un Storybook que no compila es documentación rota que nadie ve hasta
      # que la abre.
      - name: Build de Storybook
        run: npm run build-storybook

# El e2e de Playwright NO entra en el CI de PR: necesita la app levantada y el
# backend. Va en un workflow aparte, contra un entorno desplegado
# (`06-capa-0-frontend.md` §3.2).
