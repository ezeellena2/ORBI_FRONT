<!doctype html>
<!-- El tema viaja SIEMPRE por `data-theme`, y `dark` es un tema nombrado como
     los otros tres. En el mockup el oscuro vivía en `:root` sin atributo, así que
     `[data-theme="dark"]` no existía y elegir "dark" dejaba la app sin estilos. -->
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TracAuto v2 web platform para autenticacion, identidad y gestion multi-organizacion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>TracAuto v2 Web</title>
  </head>
  <body>
    <script>
      // Anti-flash: aplica el tema persistido antes de que React monte.
      // Escribe el atributo SIEMPRE, `dark` incluido: con los 4 temas nombrados
      // no hay ningun caso especial que un toggler pueda romper.
      (function() {
        var tema = 'dark';
        try {
          var p = JSON.parse(localStorage.getItem('tracauto-preferences') || '{}');
          var s = p && p.state;
          if (s && s.theme) { tema = s.theme; }
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
