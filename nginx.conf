# nginx = la "puerta de entrada". Sirve la app web (archivos estaticos) y, cuando el
# navegador pide datos (/api/...), los reenvia al gateway (el conmutador interno).
# El navegador habla con UN solo origen => no hay CORS ni cookies cross-site.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion: servir mas liviano y rapido.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash en el nombre => cache larga (nunca cambian sin cambiar el nombre).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pedidos de datos => gateway (nombre del contenedor en la red interna, puerto 8080).
    # nginx reenvia cookies y el header Authorization sin tocarlos (preserva login/refresh).
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cualquier otra ruta => la SPA (React Router resuelve la navegacion del lado cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
